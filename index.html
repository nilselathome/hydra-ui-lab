<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hydra Playground</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Open+Sans:wght@400;700;800&family=Montserrat:wght@400;700;900&family=Lato:wght@400;700;900&family=Oswald:wght@400;700&family=Raleway:wght@400;700;900&family=Poppins:wght@400;700;900&family=Playfair+Display:wght@400;700;900&family=Merriweather:wght@400;700;900&family=Nunito:wght@400;700;900&family=Ubuntu:wght@400;700&family=PT+Sans:wght@400;700&family=Roboto+Condensed:wght@400;700&family=Roboto+Mono:wght@400;700&family=Source+Code+Pro:wght@400;700&family=Inconsolata:wght@400;700&family=Bebas+Neue&family=Righteous&family=Pacifico&family=Lobster&family=Press+Start+2P&family=Space+Grotesk:wght@400;700&family=DM+Sans:wght@400;700;900&family=Anton&family=Abril+Fatface&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }

    #ui {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      /* Fixed width + reserved scrollbar gutter so the panel doesn't visibly
         resize as layer/scene content changes height (scrollbar appearing/
         disappearing) or width (long labels, dynamic editors) during playback. */
      width: 300px;
      --tp-base-width: 300px;
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-gutter: stable;
      /* No elastic rubber-band bounce past the top/bottom edge, and a
         scroll that hits either edge doesn't chain through to the canvas
         behind it — scrollTop already can't go negative, this just stops
         the bounce *look* some trackpads/browsers add on top of that.
         VSCode-sidebar-style: a hard edge, not a springy one. */
      overscroll-behavior-y: contain;
      /* Scroll-anchor headroom: the browser clamps scrollTop to
         scrollHeight - clientHeight, so a target near the end of a short
         pane/layer list can never actually reach the top of the viewport —
         there's no content left below it to scroll into. This padding is
         pure slack, always available to scroll into, so any anchor target
         can be reached regardless of what's below it. */
      padding-bottom: 400px;
      /* Scroll-snap starts OFF — armed only while the user is actively
         wheel/touch-scrolling (see the 'wheel'/'touchmove' listeners in
         initUI, src/ui.js), then switched off again shortly after. Some
         browsers re-settle scrollTop toward the nearest snap point on an
         idle timer completely outside our control — if snap were left on
         permanently, that correction could silently fire long after the
         user stopped scrolling (e.g. right as a scene switch reads the
         current scrollTop to anchor from), clobbering it with a stale
         value the user never asked for. Anchors to the top of each
         top-level pane (Audio/Scenes/Add Layer/Layers) — see
         #ui > .tp-rotv below. */
      scroll-snap-type: none;
      /* Tweakpane renders inside here */
      user-select: none;
      -webkit-user-select: none;
    }

    /* Each top-level Tweakpane pane is a direct .tp-rotv child of #ui —
       nested folders use a different class, so this only anchors pane
       boundaries, not every fold inside them. */
    #ui > .tp-rotv {
      scroll-snap-align: start;
    }

    /* Scene player running → Layers pane is read-only (the next swap would
       overwrite any edit). Dimmed + pointer-events off on everything inside
       except fold titles, so panes/layers/params can still be scrolled,
       opened and read. A tap on the sticky banner pauses the player. */
    .scene-lock-banner { display: none; }
    #ui.scene-playing .scene-lock-banner {
      display: block; position: sticky; top: 0; z-index: 5; width: 100%;
      margin: 0 0 6px; padding: 6px 8px; cursor: pointer; text-align: left;
      font: 10px monospace; color: rgba(130,240,160,0.95);
      background: rgba(20,40,28,0.92); border: 1px solid rgba(100,220,130,0.5);
      border-radius: 3px;
    }
    #ui.scene-playing .layers-pane .tp-rotv_c { opacity: 0.55; }
    #ui.scene-playing .layers-pane .tp-rotv_c * { pointer-events: none; }
    #ui.scene-playing .layers-pane .tp-rotv_c .tp-fldv_b,
    #ui.scene-playing .layers-pane .tp-rotv_c .tp-fldv_b * { pointer-events: auto; }

    /* ...but keep selection working in actual text-entry fields (Tweakpane's
       own number/text inputs included — they're <input type="text"> too). */
    #ui input[type="text"],
    #ui input[type="url"],
    #ui textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    /* Top-level layer folder titles in the Layers pane — bolder/distinct from
       nested transform/mod/animate folder titles so layers stand out in a
       long stack. Tweak freely. */
    .hydra-layer-title {
      font-weight: 900 !important;
      color: pink !important;
      height: calc(var(--cnt-usz) + 8px) !important;
    }
  </style>
</head>
<body>
  <canvas id="hydraCanvas"></canvas>
  <div id="ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script type="module" src="/src/app.js"></script>
  <script type="module">
    import { playFile, connectUrl } from '/src/audio.js';
    import { loadFromUrl } from '/src/state.js';

    const savedState = loadFromUrl();

    async function initAudioOverlay() {
      if (!savedState?.ui?.audioTrack) {
        return;
      }

      // Try to autoplay the audio track
      const url = import.meta.env.BASE_URL + savedState.ui.audioTrack;
      const autoplaySucceeded = await connectUrl(url);

      if (autoplaySucceeded) {
        // Autoplay worked, no overlay needed
        return;
      }

      // Autoplay was blocked, create and show overlay
      const overlay = document.createElement('div');
      overlay.id = 'autoplay-overlay';
      overlay.innerHTML = '<span>Press any key to play</span>';
      overlay.style.cssText = `
        position: fixed; inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 1.25rem; font-family: sans-serif;
        letter-spacing: 0.05em;
        z-index: 99999; cursor: pointer;
        opacity: 1; transition: opacity 0.5s ease;
      `;
      document.body.appendChild(overlay);

      function dismiss() {
        playFile();
        overlay.style.opacity = '0';
        overlay.style.pointerEvents = 'none';
        overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
        document.removeEventListener('keydown', dismiss);
        document.removeEventListener('click', dismiss);
      }

      document.addEventListener('keydown', dismiss);
      document.addEventListener('click', dismiss);
    }

    initAudioOverlay();
  </script>
</body>
</html>
